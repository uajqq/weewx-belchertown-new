name: Dev release
on:
  push:
    branches:
      - development
permissions:
  contents: write
concurrency:
  group: dev-release-development
  cancel-in-progress: false
jobs:
  dev-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move dev tag to this commit
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push -f origin refs/tags/dev
      - name: Recreate GitHub dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Automated release for commit ${GITHUB_SHA} on ${GITHUB_REF_NAME} branch"

          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev --yes
          fi

          gh release create dev \
            --title "Latest development version" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"
